services:
  - type: web
    name: ai-text-summarizer
    runtime: python
    plan: free
    buildCommand: pip install torch==2.0.1+cpu --index-url https://download.pytorch.org/whl/cpu && pip install -r requirements.txt
    startCommand: gunicorn app:app --bind 0.0.0.0:$PORT --timeout 300 --workers 1 --threads 4
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.6
      - key: SECRET_KEY
        generateValue: true
      - key: FLASK_ENV
        value: production
      - key: FLASK_DEBUG
        value: "False"
      - key: DATABASE_URL
        value: sqlite:///summary.db
      - key: MODEL_NAME
        value: sshleifer/distilbart-cnn-6-6
